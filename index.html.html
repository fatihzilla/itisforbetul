<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>betuleozel.com</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mplus+1p:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'cute': ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#FFD1DC',
                            lightPink: '#FFF0F5',
                            darkPink: '#FFB6C1',
                            cream: '#FFFDD0',
                            accent: '#FF6B81',
                            purple: '#E6E6FA'
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #E6E6FA 50%, #FFD1DC 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Floating Background Hearts */
        .heart-bg {
            position: absolute;
            opacity: 0.25;
            animation: floatHeart 10s linear infinite;
            pointer-events: none;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.8);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .card-shadow {
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.4), 0 10px 15px rgba(0, 0, 0, 0.03);
        }

        .btn-hover-effect {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-hover-effect:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.3);
        }

        .btn-hover-effect:active {
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between relative selection:bg-pastel-accent selection:text-white">

    <!-- Floating Background Hearts Container -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Website Link / Browser Header Bar -->
    <header class="w-full py-4 px-4 z-10">
        <div class="max-w-md mx-auto">
            <div class="bg-white/80 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-pink-200/80 shadow-sm flex items-center justify-between">
                <!-- Browser Dots -->
                <div class="flex items-center space-x-1.5">
                    <span class="w-3 h-3 rounded-full bg-rose-400 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-300 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span>
                </div>
                
                <!-- URL Link Display -->
                <div class="flex items-center space-x-2 bg-pink-50/80 px-4 py-1 rounded-xl border border-pink-100 text-xs sm:text-sm text-gray-600 font-mono select-all">
                    <i class="fa-solid fa-lock text-emerald-500 text-xs"></i>
                    <span class="font-bold text-gray-700">https://</span>
                    <span class="font-extrabold text-pastel-accent tracking-wide">betuleozel.com</span>
                </div>

                <!-- Copy Link Button -->
                <button onclick="copyLink()" class="text-gray-400 hover:text-pastel-accent transition-colors p-1" title="Linki Kopyala">
                    <i id="copy-icon" class="fa-regular fa-copy text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4 z-10">
        <div class="w-full max-w-md mx-auto">
            
            <!-- STEP 1: Question Card -->
            <div id="question-card" class="bg-white/90 backdrop-blur-md rounded-3xl p-8 text-center card-shadow border border-white transition-all duration-500 transform">
                
                <!-- Cute Mascot / Emoji Container -->
                <div class="relative w-28 h-28 mx-auto mb-6 flex items-center justify-center bg-pink-100 rounded-full animate-float">
                    <span class="text-6xl select-none" role="img" aria-label="waving cat">🐱</span>
                    <div class="absolute -top-1 -right-1 bg-white rounded-full p-2 shadow-sm">
                        <span class="text-xl">✨</span>
                    </div>
                </div>

                <!-- Greeting Title -->
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-3 tracking-tight">
                    Merhaba Betül, nasılsın?
                </h1>
                <p class="text-gray-500 text-sm mb-8">
                    Lütfen durumunu seç:
                </p>

                <!-- Interactive Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <button onclick="handleSelection('iyi1')" class="btn-hover-effect w-full sm:w-1/2 py-3.5 px-6 bg-gradient-to-r from-pink-400 to-pastel-accent text-white font-semibold rounded-2xl shadow-md flex items-center justify-center space-x-2 group">
                        <span>İyi</span>
                        <span class="group-hover:translate-x-1 transition-transform">😊</span>
                    </button>
                    
                    <button onclick="handleSelection('iyi2')" class="btn-hover-effect w-full sm:w-1/2 py-3.5 px-6 bg-gradient-to-r from-pastel-accent to-rose-400 text-white font-semibold rounded-2xl shadow-md flex items-center justify-center space-x-2 group">
                        <span>İyi</span>
                        <span class="group-hover:translate-x-1 transition-transform">🌸</span>
                    </button>
                </div>
            </div>

            <!-- STEP 2: Apology Card (Hidden initially) -->
            <div id="apology-card" class="hidden bg-white/95 backdrop-blur-md rounded-3xl p-8 text-center card-shadow border border-white transition-all duration-500 transform scale-95 opacity-0">
                
                <!-- Sad / Boynu Eğik Emoji Container -->
                <div class="relative w-32 h-32 mx-auto mb-6 flex items-center justify-center bg-rose-50 rounded-full animate-bounce-slow">
                    <span class="text-7xl select-none" role="img" aria-label="apologetic emoji">🙇‍♂️</span>
                    <div class="absolute -bottom-2 right-2 bg-pink-100 rounded-full p-2 shadow-sm">
                        <span class="text-2xl">🥺</span>
                    </div>
                </div>

                <!-- Apology Main Text -->
                <h2 class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-2 tracking-tight">
                    Özür dilerim 😔
                </h2>
                
                <!-- Updated Requested Text -->
                <p class="text-pink-600 font-bold text-xl mb-6">
                    kudurdugum için attim üzgünüm
                </p>

                <!-- Action Button (Replay) -->
                <button onclick="resetCard()" class="inline-flex items-center space-x-2 text-sm font-semibold text-gray-500 hover:text-pastel-accent transition-colors duration-200 py-2.5 px-5 rounded-2xl bg-pink-50 hover:bg-pink-100 border border-pink-100">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Tekrar Sor</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-gray-400 z-10">
        <p>Betül için özel olarak tasarlandı 💌 • <span class="font-bold text-gray-500">betuleozel.com</span></p>
    </footer>

    <script>
        // Generate floating background hearts on load
        function createFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const heartIcons = ['💖', '💕', '🌸', '✨', '💗', '🧸'];
            const heartCount = 15;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${6 + Math.random() * 8}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${16 + Math.random() * 20}px`;
                container.appendChild(heart);
            }
        }

        // Copy Link Action
        function copyLink() {
            const textToCopy = 'https://betuleozel.com';
            const input = document.createElement('input');
            input.value = textToCopy;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);

            const icon = document.getElementById('copy-icon');
            icon.className = 'fa-solid fa-check text-emerald-500 text-sm';
            setTimeout(() => {
                icon.className = 'fa-regular fa-copy text-sm';
            }, 2000);
        }

        // Handle button clicks
        function handleSelection(option) {
            const questionCard = document.getElementById('question-card');
            const apologyCard = document.getElementById('apology-card');

            // Trigger Confetti / Heart Burst Effect
            triggerHeartsConfetti();

            // Transition Question Card out
            questionCard.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                questionCard.classList.add('hidden');
                
                // Show Apology Card
                apologyCard.classList.remove('hidden');
                
                // Trigger reflow for smooth animation
                void apologyCard.offsetWidth;

                apologyCard.classList.remove('scale-95', 'opacity-0');
                apologyCard.classList.add('scale-100', 'opacity-100');
            }, 300);
        }

        // Reset to initial state
        function resetCard() {
            const questionCard = document.getElementById('question-card');
            const apologyCard = document.getElementById('apology-card');

            apologyCard.classList.remove('scale-100', 'opacity-100');
            apologyCard.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                apologyCard.classList.add('hidden');
                
                questionCard.classList.remove('hidden');
                
                // Trigger reflow
                void questionCard.offsetWidth;

                questionCard.classList.remove('scale-95', 'opacity-0');
                questionCard.classList.add('scale-100', 'opacity-100');
            }, 300);
        }

        // Confetti Heart Effect using canvas-confetti
        function triggerHeartsConfetti() {
            const count = 200;
            const defaults = {
                origin: { y: 0.7 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            // Burst with heart/pink colors
            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                colors: ['#FF6B81', '#FFB6C1', '#FFD1DC']
            });
            fire(0.2, {
                spread: 60,
                colors: ['#FF6B81', '#E6E6FA', '#FFF0F5']
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8,
                colors: ['#FF6B81', '#FFB6C1', '#FFD1DC']
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                colors: ['#FF6B81', '#E6E6FA']
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
                colors: ['#FF6B81', '#FFB6C1']
            });
        }

        // Initialize background on page load
        window.addEventListener('DOMContentLoaded', () => {
            createFloatingHearts();
        });
    </script>
</body>
</html>
